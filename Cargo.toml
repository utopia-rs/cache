[package]
name = "utopia-cache"
description = "Key-value caching with expiring entries over memory, files, Redis, Redis Cluster, Memcached and Hazelcast, with sharding, pooling, circuit breaking and purge-safe leases."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/cache"

[features]
default = ["redis", "filesystem"]
# Redis (redis-rs connections) and the multiplexed Redis adapter.
redis = ["dep:redis", "tokio/net", "tokio/io-util"]
# Redis Cluster (redis-rs cluster client).
redis-cluster = ["redis", "redis/cluster-async"]
# Memcached and Hazelcast (Memcached text protocol).
memcached = ["tokio/net", "tokio/io-util"]
# Files under a directory.
filesystem = ["tokio/fs"]

[dependencies]
bytes = "1"
crc32fast = "1"
flate2 = "1"
hex = "0.4"
indexmap = "2"
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
postcard = { version = "1", default-features = false, features = ["use-std"] }
redis = { version = "0.32", optional = true, default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }
tracing = "0.1"
utopia-circuit-breaker = { version = "0.1.0", git = "https://github.com/utopia-rs/circuit-breaker", default-features = false }
utopia-pools = { version = "0.1.0", git = "https://github.com/utopia-rs/pools" }
utopia-telemetry = { version = "0.1.0", git = "https://github.com/utopia-rs/telemetry", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt", "io-util"] }

[package.metadata.utopia]
php-sync = "bf7bd52d83df090e06824cf3c1d0a996f28e5f8b"