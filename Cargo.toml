[package]
name = "utopia-cache"
description = "A Redis-backed cache with leases and purges."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
crc32fast = "1"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
tracing = "0.1"